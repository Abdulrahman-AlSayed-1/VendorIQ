[project]
name = "vendoriq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdulrahman Al-Sayed", email = "haniabood935@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.20.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=3.3.0",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "neonize>=0.10.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.12",
    "ruff>=0.8.0",
    "stripe>=10.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vendoriq = "vendoriq:main"
vendoriq-bot = "vendoriq.ai.bot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
venvPath = "."
venv = ".venv"

 